<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="./assets/icons/favicon-e-coracao.ico">
  <title>Alecrim e Tomilho</title>
  <style>
    :root{color-scheme:dark;--ink:#f5edff;--muted:#c2b2d1;--paper:#302442;--accent:#b794f4;--accent-dark:#8b5fbf;--line:#5b4672;--shadow:0 18px 50px #09040f88}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(145deg,#170f23,#241632 55%,#110b19);display:grid;place-items:center;padding:28px}
    main{width:min(680px,100%);background:#21152fd9;border:1px solid #49365e;border-radius:28px;padding:clamp(28px,6vw,58px);box-shadow:var(--shadow);backdrop-filter:blur(12px)}
    header{text-align:center;margin-bottom:34px}
    .logo{display:block;width:min(560px,100%);height:auto;margin:0 auto 18px;filter:drop-shadow(0 10px 18px #0008)}
    h1{margin:0;font-family:Georgia,serif;font-size:clamp(28px,5vw,42px);font-weight:600;letter-spacing:-.03em}
    .intro{margin:10px 0 0;color:var(--muted);font-size:15px}
    nav{display:grid;gap:12px}
    a{position:relative;display:flex;align-items:center;justify-content:center;padding:18px 20px;border:1px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);text-decoration:none;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
    a:hover,a:focus-visible{transform:translateY(-2px);border-color:#c8a8d6;box-shadow:0 8px 20px #57316f18;outline:none}
    .link-copy{display:grid;gap:4px;text-align:center}.link-title{font-weight:700}.link-description{color:var(--muted);font-size:13px}.arrow{position:absolute;right:20px;color:var(--accent);font-size:22px}
    footer{text-align:center;margin-top:30px;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <main>
    <header>
      <img class="logo" src="./assets/images/alecrim-tomilho-logo.png" alt="Alecrim e Tomilho">
    </header>
    <nav aria-label="Projetos">
      <a href="./Cobertor%20solteiro%20Gatos.html">
        <span class="link-copy"><span class="link-title">Cobertor solteiro — Gatos</span></span>
      </a>
    </nav>
    <footer>Feito com carinho por Neto</footer>
  </main>
</body>
</html>
